name: pwhlcord-stats_dev

services:
  app:
    image: asleepysheepy/pwhlcord-stats-web
    pull_policy: never
    env_file:
      - ../.env.dev
    environment:
      - NODE_ENV=development
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ../
          target: /app
          ignore:
            - node_modules/

  db:
    image: postgres:18
    restart: always
    volumes:
      - ${PWD}/db-data:/var/lib/postgresql
    env_file:
      - ../.env.dev
    expose:
      - 5432
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: ..
      dockerfile: ./docker/dev.Dockerfile
    image: asleepysheepy/pwhlcord-stats-web
    pull_policy: never
    command: ['npx', 'drizzle-kit', 'migrate']
    env_file:
      - ../.env.dev
    depends_on:
      db:
        condition: service_healthy
