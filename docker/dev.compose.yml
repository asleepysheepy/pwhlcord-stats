name: pwhlcord-stats_dev

services:
  app:
    image: asleepysheepy/pwhlcord-stats-web
    pull_policy: never
    env_file:
      - ../.env.dev
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ../
          target: /app
          ignore:
            - node_modules/

  storybook:
    image: asleepysheepy/pwhlcord-stats-web
    pull_policy: never
    command: ['npm', 'run', 'storybook']
    environment:
      NODE_ENV: development
    ports:
      - 6006:6006
    depends_on:
      migrations:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ../
          target: /app
          ignore:
            - node_modules/

  migrations:
    build:
      context: ..
      dockerfile: ./docker/dev.Dockerfile
    image: asleepysheepy/pwhlcord-stats-web
    pull_policy: never
    command: ['npm', 'run', 'db:migrate']
    env_file:
      - ../.env.dev
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: always
    volumes:
      - ${PWD}/db-data:/var/lib/postgresql
    env_file:
      - ../.env.dev
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  pg_admin:
    image: dpage/pgadmin4
    ports:
      - 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: pg_admin@example.com
      PGADMIN_DEFAULT_PASSWORD: password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    depends_on:
      db:
        condition: service_healthy
    configs:
      - source: pgadmin-pgpass
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
        mode: 0444

configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "PWHLcord Stats",
            "Group": "Servers",
            "Host": "db",
            "Port": 5432,
            "MaintenanceDB": "postgres",
            "Username": "postgres",
            "PassFile": "/config/pgpass"
          }
        }
      }
  pgadmin-pgpass:
    content: |
      db:5432:*:postgres:password
